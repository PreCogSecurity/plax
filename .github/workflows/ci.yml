name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Lint, test, and audit on Node ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [18, 20, 22]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test
        # Coverage not run: Plax is a single-file IIFE loaded via new Function()
        # in tests, which bypasses Jest's instrumentation. A build step would be
        # needed for accurate coverage measurement, but Plax intentionally has
        # no build step (drop-in browser script).

      - name: Audit dependencies
        run: npm audit --audit-level=high